name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install libsecret
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libsecret-1-0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The committed AndroidManifest.xml is a stub (no <activity>); flutter create
      # will not overwrite it, so remove it and let Flutter generate the real one.
      - name: Remove stub Android manifest
        run: rm -f android/app/src/main/AndroidManifest.xml
      - run: flutter create . --project-name civwatch_app --platforms=android,ios,linux,windows,macos
      - name: Wire Android network security config
        run: bash tool/wire_android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-linux:
    needs: analyze-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name civwatch_app --platforms=linux
      - run: flutter pub get
      - run: flutter build linux --release

  build-android:
    needs: analyze-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Remove stub Android manifest
        run: rm -f android/app/src/main/AndroidManifest.xml
      - run: flutter create . --project-name civwatch_app --platforms=android
      - name: Wire cleartext policy
        run: bash tool/wire_android.sh
      - run: flutter pub get
      - run: flutter build apk --release

  build-windows:
    needs: analyze-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name civwatch_app --platforms=windows
      - run: flutter pub get
      - run: flutter build windows --release
