name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android,ios,linux --project-name civwatch_app
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
