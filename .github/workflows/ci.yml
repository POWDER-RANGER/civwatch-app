name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install libsecret
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libsecret-1-0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name civwatch_app --platforms=android,ios,linux,windows,macos
      - name: Wire Android network security config
        run: |
          mkdir -p android/app/src/main/res/xml
          if ! grep -q 'networkSecurityConfig' android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' android/app/src/main/AndroidManifest.xml
          fi
          grep -q 'networkSecurityConfig' android/app/src/main/AndroidManifest.xml
          grep -q 'activity' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-linux:
    needs: analyze-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name civwatch_app --platforms=linux
      - run: flutter pub get
      - run: flutter build linux --release

  build-android:
    needs: analyze-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name civwatch_app --platforms=android
      - name: Wire cleartext policy
        run: |
          if ! grep -q 'networkSecurityConfig' android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' android/app/src/main/AndroidManifest.xml
          fi
          grep -q 'activity' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release

  build-windows:
    needs: analyze-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name civwatch_app --platforms=windows
      - run: flutter pub get
      - run: flutter build windows --release
